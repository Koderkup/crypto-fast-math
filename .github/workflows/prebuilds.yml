name: Prebuilds & publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: win32-x64
            node_arch: x64
            container: ''
            prebuild_path: prebuilds/win32-x64/crypto-fast-math.node
          - os: ubuntu-latest
            target: linux-x64
            node_arch: x64
            container: ''
            prebuild_path: prebuilds/linux-x64/crypto-fast-math.node
          - os: ubuntu-24.04-arm
            target: linux-arm64
            node_arch: arm64
            container: ''
            prebuild_path: prebuilds/linux-arm64/crypto-fast-math.node
          # macOS builds
          - os: macos-14
            target: darwin-x64
            node_arch: x64
            container: ''
            prebuild_path: prebuilds/darwin-x64/crypto-fast-math.node
          - os: macos-14
            target: darwin-arm64
            node_arch: arm64
            container: ''
            prebuild_path: prebuilds/darwin-arm64/crypto-fast-math.node
          # Alpine Linux (musl) builds — for Alpine-based containers.
          # node-gyp-build has NO linuxmusl-* directory: it resolves
          # prebuilds/linux-<arch>/ via process.platform and selects the libc
          # by filename tag, so prebuildify runs with --tag-libc and the musl
          # binary lands next to the glibc one as crypto-fast-math.musl.node.
          - os: ubuntu-latest
            target: linuxmusl-x64
            node_arch: x64
            container: 'node:22-alpine'
            prebuild_path: prebuilds/linux-x64/crypto-fast-math.musl.node
          # NOTE: JS actions (checkout/setup-node) inside Alpine containers are
          # supported on x64 runners ONLY, so the arm64 musl build runs WITHOUT
          # a job container and invokes the Alpine toolchain via `docker run`
          # in a shell step instead.
          - os: ubuntu-24.04-arm
            target: linuxmusl-arm64
            node_arch: arm64
            container: ''
            use_docker: true
            prebuild_path: prebuilds/linux-arm64/crypto-fast-math.musl.node
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js (unless container)
        if: ${{ !matrix.container }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          architecture: ${{ matrix.node_arch }}
      - name: Install build dependencies (Alpine container)
        if: ${{ matrix.container }}
        run: |
          apk add --no-cache make g++ python3 git
          echo "=== Alpine build diagnostics ==="
          node --version
          npm --version
          make --version | head -1
          g++ --version | head -1
          python3 --version
          echo "=== node-gyp config ==="
          npx node-gyp --version
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build addon and prebuilds
        if: ${{ !matrix.container && !matrix.use_docker }}
        run: npm run prebuild
      - name: Build addon and prebuilds (Alpine — tag musl libc)
        if: ${{ matrix.container }}
        run: npm run build:cpp && npx prebuildify --napi --strip --pre-existing --tag-libc
      - name: Build addon and prebuilds (Alpine via docker — tag musl libc)
        if: ${{ matrix.use_docker }}
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace node:22-alpine sh -e -c '
            apk add --no-cache make g++ python3 git
            node --version
            npm --version
            npm run build:cpp
            npx prebuildify --napi --strip --pre-existing --tag-libc
          '
      - name: Verify this platform's binary
        run: node scripts/check-prebuilds.js ${{ matrix.target }}
      - name: Upload prebuild
        uses: actions/upload-artifact@v4
        with:
          name: prebuilds-${{ matrix.target }}
          path: ${{ matrix.prebuild_path }}
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build TypeScript
        run: npm run build:ts
      - name: Download all prebuilds
        uses: actions/download-artifact@v4
        with:
          path: merged
          pattern: prebuilds-*
          # NOTE: no merge-multiple — each artifact keeps its own folder.
          # The exact internal layout depends on upload-artifact@v4 path
          # handling, so the assembly step below is layout-agnostic: it
          # walks each artifact folder and finds every *.node file.
      - name: Assemble prebuilds
        run: |
          echo "=== merged/ tree ==="
          find merged -type f 2>/dev/null | head -50 || true
          echo ""
          mkdir -p prebuilds
          for dir in merged/prebuilds-*/; do
            echo "--- processing: $dir"
            # linuxmusl-* artifacts contain the .musl.node file that lives in
            # the plain linux-<arch>/ directory, so map the name accordingly.
            target=$(basename "$dir" | sed -e 's/^prebuilds-//' -e 's/^linuxmusl-/linux-/')
            mkdir -p "prebuilds/$target"
            find "$dir" -name "*.node" -exec cp -v {} "prebuilds/$target/" \;
          done
          echo "--- prebuilds/ final ---"
          ls -R prebuilds/
          node scripts/check-prebuilds.js
      - name: Run test suite against the merged prebuilds
        run: npm run test:quick
      - name: Verify package contents
        run: npm pack --dry-run
      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}