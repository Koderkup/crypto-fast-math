name: Prebuilds & publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: win32-x64
            node_arch: x64
          - os: ubuntu-latest
            target: linux-x64
            node_arch: x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
            node_arch: arm64
          # macos-13 (Intel) is retired. Build darwin-x64 on macos-14 by
          # installing the x64 build of Node.js — macOS runs it under
          # Rosetta 2 transparently, and process.arch === 'x64', which is
          # what prebuildify needs to emit prebuilds/darwin-x64/.
          - os: macos-14
            target: darwin-x64
            node_arch: x64
          - os: macos-14
            target: darwin-arm64
            node_arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          architecture: ${{ matrix.node_arch }}
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build addon and prebuilds
        run: npm run prebuild
      - name: Verify this platform's binary
        run: node scripts/check-prebuilds.js ${{ matrix.target }}
      - name: Upload prebuild
        uses: actions/upload-artifact@v4
        with:
          name: prebuilds-${{ matrix.target }}
          path: prebuilds/${{ matrix.target }}/crypto-fast-math.node
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build TypeScript
        run: npm run build:ts
      - name: Download all prebuilds
        uses: actions/download-artifact@v4
        with:
          path: merged
          merge-multiple: true
          pattern: prebuilds-*
      - name: Assemble prebuilds
        run: |
          mkdir -p prebuilds
          cp -r merged/prebuilds/* prebuilds/
          node scripts/check-prebuilds.js
      - name: Run test suite against the merged prebuilds
        run: npm run test:quick
      - name: Verify package contents
        run: npm pack --dry-run
      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}