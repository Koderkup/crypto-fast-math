name: Prebuilds & publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: win32-x64
            node_arch: x64
          - os: ubuntu-latest
            target: linux-x64
            node_arch: x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
            node_arch: arm64
          # macos-13 (Intel) is retired. Build darwin-x64 on macos-14 by
          # installing the x64 build of Node.js — macOS runs it under
          # Rosetta 2 transparently, and process.arch === 'x64', which is
          # what prebuildify needs to emit prebuilds/darwin-x64/.
          - os: macos-14
            target: darwin-x64
            node_arch: x64
          - os: macos-14
            target: darwin-arm64
            node_arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          architecture: ${{ matrix.node_arch }}
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build addon and prebuilds
        run: npm run prebuild
      - name: Verify this platform's binary
        run: node scripts/check-prebuilds.js ${{ matrix.target }}
      - name: Upload prebuild
        uses: actions/upload-artifact@v4
        with:
          name: prebuilds-${{ matrix.target }}
          path: prebuilds/${{ matrix.target }}/crypto-fast-math.node
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build TypeScript
        run: npm run build:ts
      - name: Download all prebuilds
        uses: actions/download-artifact@v4
        with:
          path: merged
          pattern: prebuilds-*
          # NOTE: no merge-multiple — each artifact keeps its own folder.
          # The exact internal layout depends on upload-artifact@v4 path
          # handling, so the assembly step below is layout-agnostic: it
          # walks each artifact folder and finds every *.node file.
      - name: Assemble prebuilds
        run: |
          echo "=== merged/ tree ==="
          find merged -type f 2>/dev/null | head -50 || true
          echo ""
          mkdir -p prebuilds
          for dir in merged/prebuilds-*/; do
            echo "--- processing: $dir"
            target=$(basename "$dir" | sed 's/^prebuilds-//')
            mkdir -p "prebuilds/$target"
            find "$dir" -name "*.node" -exec cp -v {} "prebuilds/$target/" \;
          done
          echo "--- prebuilds/ final ---"
          ls -R prebuilds/
          node scripts/check-prebuilds.js
      - name: Run test suite against the merged prebuilds
        run: npm run test:quick
      - name: Verify package contents
        run: npm pack --dry-run
      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}